<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Library</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                OneLibrary
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Games</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">My Library</a>
                    </li>
                </ul>

                <form class="d-flex">
                    <input
                        id="search-input"
                        class="form-control"
                        type="search"
                        placeholder="Search games..."
                    >
                </form>

            </div>
        </div>
    </nav>


    <main class="container py-5">

        <section class="hero">
            <h1>Track the games you play.</h1>

            <p>
                Discover, organize and keep track of your gaming journey.
            </p>
        </section>


        <section class="mt-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Games</h2>

                <span id="games-count" class="text-muted"></span>
            </div>

            <div id="games-list" class="row g-4">
                <!-- Games will be rendered here -->
            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
